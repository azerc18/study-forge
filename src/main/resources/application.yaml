server:
  port: 8080

spring:
  application:
    name: study-forge
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${DEFAULT_PROFILE:local}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  storage:
    local-dir: ${STORAGE_DIR:./storage/uploads}
    document:
      max-pages: 100
      short-document-words: 1500

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: study-forge
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: true


