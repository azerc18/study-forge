spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  forward-headers-strategy: framework   # lấy IP thật của người dùng qua Caddy (cho rate limit)

security:
  jwt:
    cookie-secure: true

logging:
  level:
    root: INFO
    com.az.studyforge: INFO