name: workflow.yml

on:
  pull_request:
    paths-ignore: ['frontend/**']
  push:
    branches: [main]
    paths-ignore: ['frontend/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw clean verify

