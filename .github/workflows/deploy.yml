name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          retention-days: 3
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3
  deploy:
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: build/target

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: build/dist

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Upload files
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p ${{ secrets.VPS_PORT }}"
          DEST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/studyforge"
          rsync -az --delete -e "$SSH" build/target/ "$DEST/target/"
          rsync -az --delete -e "$SSH" build/dist/ "$DEST/frontend/dist/"
          rsync -az -e "$SSH" Dockerfile .dockerignore "$DEST/"
          rsync -az --inplace -e "$SSH" deploy/Caddyfile deploy/docker-compose.prod.yml "$DEST/deploy/"
      - name: Restart services
        run: |
          ssh -i $HOME/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            set -e
            cd /opt/studyforge/deploy
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f
          '
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.APP_URL }}/actuator/health"; then
              echo " -> OK"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done
          echo "Backend did not become healthy"
          exit 1