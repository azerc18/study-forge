server:
  port: 8080

spring:
  application:
    name: study-forge
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${DEFAULT_PROFILE:local}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  storage:
    local-dir: ${STORAGE_DIR:./storage/uploads}
  document:
    max-pages: 100
    short-document-words: 1500
  llm:
    max-retries: 2
    daily-budget-usd: 0.5
    providers:
      - name: deepseek
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        model: deepseek-flash
        timeout: 120s
        max-tokens: 8000
        input-price-per-million: 0.66
        output-price-per-million: 1.98
        extra-body:
          thinking:
            type: disabled
  generation:
    quota-zone: Asia/Ho_Chi_Minh
    worker-enabled: true
    max-concurrent-jobs: 2
    llm-concurrency: 3
    chunk-max-attempts: 2
    stuck-timeout: 15m
    top-up-rounds: 2
  feedback:
    daily-limit: 30
    material-max-words: 3000
  rate-limit:
    enabled: true
    rules:
      - name: auth
        methods: [ POST ]
        path: /api/auth/**
        key: IP
        capacity: 20
        period: 1m
      - name: upload
        methods: [ POST ]
        path: /api/documents
        capacity: 10
        period: 1h
      - name: generate
        methods: [ POST ]
        path: /api/quiz-sets
        capacity: 5
        period: 10m
      - name: essay-feedback
        methods: [ POST ]
        path: /api/questions/*/essay-feedback
        capacity: 6
        period: 1m
      - name: exam-start
        methods: [ POST ]
        path: /api/quiz-sets/*/exams
        capacity: 20
        period: 1h
      - name: api
        path: /api/**
        capacity: 300
        period: 1m

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: study-forge
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: true


