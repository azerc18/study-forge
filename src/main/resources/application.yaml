server:
  port: 8080

spring:
  application:
    name: study-forge
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${DEFAULT_PROFILE:local}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  storage:
    local-dir: ${STORAGE_DIR:./storage/uploads}
  document:
    max-pages: 100
    short-document-words: 1500
  llm:
    max-retries: 2
    providers:
      - name: deepseek
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        model: deepseek-flash
        timeout: 120s
        max-tokens: 8000
        extra-body:
          thinking:
            type: disabled
      - name: groq
        base-url: https://api.groq.com/openai/v1
        api-key: ${GROQ_API_KEY:}
        model: ${GROQ_MODEL:llama-3.3-70b-versatile}
        timeout: 60s
        max-tokens: 8000
      - name: gemini
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
        api-key: ${GEMINI_API_KEY:}
        model: ${GEMINI_MODEL:gemini-3.5-flash}
        timeout: 120s
        max-tokens: 8000

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: study-forge
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: true


